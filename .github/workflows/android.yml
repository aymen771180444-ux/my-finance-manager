# Builds the Android app (APK), signs it, and publishes it on the repository's Releases page.
# Needs two repository secrets: ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD.
name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Check the signing key is set up
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (Settings > Secrets and variables > Actions) and run this again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build the app for Android
        run: npm run build
        env:
          BUILD_TARGET: android

      - name: Create the Android project
        run: |
          npx cap add android
          node scripts/android-setup.mjs "$VERSION_CODE" "$VERSION_NAME"

      - name: Compile the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign the APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias mfm \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "MyFinance-$VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "MyFinance-$VERSION_NAME.apk" | head -3
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: مدير أموالي ${{ env.VERSION_NAME }}
          make_latest: true
          files: MyFinance-${{ env.VERSION_NAME }}.apk
          body: |
            ### التثبيت على Android
            1. حمّل ملف `MyFinance-${{ env.VERSION_NAME }}.apk` من قسم **Assets** أدناه.
            2. افتحه من الإشعار أو من تطبيق الملفات ← التنزيلات.
            3. إن طلب Android ذلك: اسمح بالتثبيت من هذا المصدر، ثم اضغط **تثبيت**.

            التحديث: ثبّت الملف الأحدث فوق التطبيق الحالي، وتبقى بياناتك كما هي.

            ### Install on Android
            Download the `.apk` from **Assets**, open it, allow installs from this source if asked, then tap **Install**.
            To update, install the newer file over the current app; your data stays.
